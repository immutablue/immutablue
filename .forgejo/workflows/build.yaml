# build.yaml - Forgejo CI workflow
#
# Builds the deps container, then builds and pushes the
# immutablue image (ZFS-enabled once ZFS_ARG is restored) on every push to master.
#
# Required secrets:
#   QUAY_USER     - quay.io username
#   QUAY_TOKEN    - quay.io password/token
#   RELEASE_TOKEN - Forgejo API token, to dispatch hyacinth-macaw's build
#                   (Forgejo refuses secret names starting with FORGEJO_)
#
# SPDX-License-Identifier: AGPL-3.0-or-later

name: Build Immutablue

on:
  push:
    branches:
      - master

env:
  # ZFS is off until OpenZFS publishes a Fedora 45 repo (see zfs_rpm_url in
  # packages.yaml); the image is built without it. Swap the lines back then.
  ZFS_ARG: ""
  # ZFS_ARG: "ZFS=1"

jobs:
  build:
    runs-on: linux-amd64
    container:
      image: git.podbielniak.com/zachpodbielniak/build-container:44
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
          git config --global url."https://git.podbielniak.com/".insteadOf "git@git-ssh.podbielniak.com:"
          git submodule update --init --recursive

      - name: Login to quay.io
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          backoff=30
          for attempt in 1 2 3; do
              if buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io; then
                  exit 0
              fi
              echo "Login attempt $attempt failed, retrying in ${backoff}s..."
              sleep "$backoff"
              backoff=$((backoff * 2))
          done
          echo "All login attempts failed"
          exit 1

      - name: Build deps container
        run: make build-deps

      - name: Push deps container
        run: make push-deps

      - name: Clean up deps images
        run: make clean-deps

      - name: Pre-test (shellcheck)
        run: make ${{ env.ZFS_ARG }} pre_test

      - name: Build image
        run: make ${{ env.ZFS_ARG }} SKIP_TEST=1 build

      - name: Test image
        run: make ${{ env.ZFS_ARG }} test

      - name: Push image
        run: make ${{ env.ZFS_ARG }} push

      - name: Clean up images
        run: make ${{ env.ZFS_ARG }} clean-build

      - name: Trigger hyacinth-macaw build
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          curl -sf -X POST \
              -H "Authorization: token ${RELEASE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"ref":"master"}' \
              "https://git.podbielniak.com/api/v1/repos/immutablue/hyacinth-macaw/actions/workflows/on-push-build.yaml/dispatches"
