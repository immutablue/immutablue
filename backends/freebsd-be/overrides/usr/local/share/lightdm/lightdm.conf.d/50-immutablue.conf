# Immutablue (freebsd-be): the login screen.
#
# LightDM replaces gdm, which FreeBSD builds X11-only, so that Wayland
# sessions -- gowl, CMacs -- can be chosen beside GNOME (X11).
# stages/61-freebsd-desktop.sh enables it; local changes belong in
# /usr/local/etc/lightdm/lightdm.conf, which overrides this file.
[Seat:*]
greeter-session=lightdm-gtk-greeter
sessions-directory=/usr/local/share/xsessions:/usr/local/share/wayland-sessions
# GNOME (X11) until a user has picked something else at the greeter.
user-session=gnome
