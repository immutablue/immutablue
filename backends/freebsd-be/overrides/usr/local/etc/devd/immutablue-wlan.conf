# Immutablue: give a wireless card that attaches after boot its wlan(4)
# interface.
#
# rc.d/immutablue_wlan writes the wlans_<card> entries that FreeBSD needs to
# create wlan0, but only for cards the kernel already knows when it runs.
# iwlwifi, rtw88/rtw89 and other LinuxKPI drivers attach seconds later, once
# their firmware has loaded, and the stock rule in /etc/devd.conf
# (pccard_ether startchildren) then finds no entry and creates nothing -- the
# card stayed without wlan0 until something wrote one and the machine
# rebooted. devd runs only the highest-priority matching attach statement, so
# this one, above the stock priority 0, writes the entry first and then does
# what the stock rule does. devctl queues attach events until devd starts, so
# a card that attached before devd did is handled too.
attach 10 {
	device-name "$wifi-driver-regex";
	action "/usr/sbin/service immutablue_wlan start; /etc/pccard_ether $device-name startchildren";
};
