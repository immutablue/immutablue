# Immutablue (freebsd-be): enable the pkgbase repository so the base system,
# kernel and bootloader install and update as packages. URL and key layout
# follow the FreeBSD-base entry in FreeBSD 15's /etc/pkg/FreeBSD.conf;
# base_release_${VERSION_MINOR} is the 15.1-RELEASE package set.
FreeBSD-base: {
  url: "pkg+https://pkg.FreeBSD.org/${ABI}/base_release_${VERSION_MINOR}",
  mirror_type: "srv",
  signature_type: "fingerprints",
  fingerprints: "/usr/share/keys/pkgbase-${VERSION_MAJOR}",
  enabled: yes
}
