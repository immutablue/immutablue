# Introduced via the immutablue project (freebsd-be backend).
# - https://gitlab.com/immutablue/immutablue
#
# Defaults for pw(8) useradd -- which is how GNOME's first-login setup
# (accountsservice) creates users here, without naming a shell. FreeBSD's
# default is /bin/sh; Immutablue's profile scripts and tooling assume bash,
# as on the Linux backends.
defaultshell /usr/local/bin/bash
