# Anaconda configuration for the Immutablue live ISO
#
# Loaded after the product profile os-release selects (fedora-silverblue for
# the GNOME images), so it only overrides what Immutablue does differently.

[Bootloader]
# The kickstart's %pre-install empties EFI/fedora on the target ESP before
# the image's boot loader is installed there (see immutablue-live.ks)
efi_dir = fedora
menu_auto_hide = True

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[Localization]
use_geolocation = False
