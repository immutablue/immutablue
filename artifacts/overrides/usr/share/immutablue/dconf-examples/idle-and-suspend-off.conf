# Idle and suspend behaviour -- an EXAMPLE, not active.
#
# This lives outside /etc/dconf/db/local.d on purpose. dconf update reads every
# file in that directory regardless of extension -- a '.disabled' suffix does
# not exclude it -- so the only way to ship a keyfile without applying it is to
# keep it out of the database directory entirely.
#
# It records settings considered for the base image and deliberately left out.
#
# Every key here disables a power-saving behaviour. On the maintainer's desktop
# that is the desired result. As a default in a base image consumed by other
# people, on laptops, it is the wrong call:
#
#   - sleep-inactive-battery-type='nothing' means a laptop closed into a bag on
#     battery never suspends. That is a flat battery, and on some hardware a
#     hot one.
#   - idle-delay=0 disables screen blanking entirely, so a locked-but-unblanked
#     display stays lit indefinitely and burns OLED panels.
#
# A derivative image for a known machine (Hyacinth Macaw) is the right place
# for these. To adopt them there, copy this file into
# /etc/dconf/db/local.d/ and run `dconf update`.

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/settings-daemon/plugins/power]
ambient-enabled=false
idle-dim=false
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='nothing'
