# Immutablue coredump policy.
#
# systemd-coredump's stock configuration is sized for a server that rarely
# crashes. This image is a development workstation that ships and builds a lot
# of native code (cmacs, gowl, gst, gsurf, and the GLib libraries under
# /usr/src/gitlab), so segfaults during development are routine rather than
# exceptional -- and every one of them writes a compressed image of the
# process's address space into /var/lib/systemd/coredump.
#
# Left unbounded that is a slow disk-filler on a machine whose /var is shared
# with container storage, flatpaks and distrobox images. The defaults below cap
# the damage while keeping cores useful for actually debugging a crash.
[Coredump]
# Keep cores on disk (the alternative, 'none', would make gdb post-mortems
# impossible, which defeats the point on a development image).
Storage=external

# Compress cores. A GTK or Emacs process can easily map a gigabyte; zstd
# brings a typical core down by an order of magnitude.
Compress=yes

# Refuse to store a single core larger than this. A runaway process that has
# mapped tens of gigabytes is not worth preserving, and writing it out would
# stall the machine.
ProcessSizeMax=8G
ExternalSizeMax=8G

# Total disk budget for stored cores. systemd vacuums the oldest first once
# this is exceeded, so a crash loop cannot consume the filesystem.
MaxUse=4G

# Always leave this much free space regardless of MaxUse, so coredump storage
# can never be the reason /var fills.
KeepFree=2G
