# Immutablue: keep libvirt's /var directories correctly SELinux-labeled.
#
# Why this file exists
# --------------------
# libvirt is installed from packages.yaml during the container image build, so
# the RPM transaction that creates /var/lib/libvirt and /var/cache/libvirt runs
# inside the build container -- not against the running host's SELinux policy.
# RPM's normal "label the file from the loaded policy at install time" step
# therefore never happens for the host's real /var, and the directories land on
# disk with the generic parent types (var_lib_t, var_log_t, var_t) instead of
# virt_var_lib_t / virt_log_t / virt_cache_t.
#
# ostree relabels the deployment root (/usr, and /etc via the config merge) on
# every deployment, but deliberately never touches /var -- that is machine-local
# mutable state it does not own. So the wrong labels are permanent: they survive
# every upgrade, rebase and image rebuild, because nothing in the normal system
# lifecycle ever runs restorecon there.
#
# The confined modular daemons then cannot write their own directories, and the
# failure surfaces as a misleading error one subsystem at a time:
#
#   virtnetworkd  -> "Requested operation is not valid: network 'default' is
#                     not active", with the real cause buried in the journal as
#                     "couldn't write dnsmasq config file
#                     '/var/lib/libvirt/dnsmasq/default.conf': Permission denied"
#   virtlogd      -> "can't connect to virtlogd: Unable to open file:
#                     /var/log/libvirt/qemu/<domain>.log: Permission denied"
#   virtqemud     -> qemu capabilities cache writes under /var/cache/libvirt
#
# A second path produces the same breakage without any image involvement: when a
# daemon creates one of these directories at runtime, SELinux gives it the
# parent's type unless a type transition rule covers the case. None does here,
# so virtlogd creating /var/log/libvirt gets var_log_t and is then forbidden to
# write into the directory it just made. Asserting the labels every boot fixes
# that case on the following boot.
#
# Notes
# -----
#   * Mode/ownership are left as '-' on purpose. A recursive Z with an explicit
#     mode applies that mode to files as well as directories, which is wrong for
#     log and image files. The top-level directory modes are corrected by
#     `just fix_libvirt_selinux_mislabel` instead.
#   * systemd-tmpfiles-setup.service is WantedBy=sysinit.target, so this runs
#     long before virtqemud starts any autostarted domain. That ordering matters:
#     libvirt assigns dynamic svirt_image_t MCS labels to disk images while a VM
#     is running, and relabeling underneath a live domain would clobber them.
#   * /run/libvirt is deliberately absent. Its labels come from SELinux type
#     transitions as the daemons create their own runtime state, and the shipped
#     file_contexts regex for that path predates the modular daemon split -- a
#     restorecon there would force dnsmasq_var_run_t onto live virtnetworkd
#     files. /run is tmpfs and rebuilt every boot, so it cannot drift anyway.
#
# See also: `just fix_libvirt_selinux_mislabel` for the on-demand equivalent.

#Type Path                 Mode User Group Age Argument
Z     /var/lib/libvirt     -    -    -     -   -
Z     /var/log/libvirt     -    -    -     -   -
Z     /var/cache/libvirt   -    -    -     -   -
