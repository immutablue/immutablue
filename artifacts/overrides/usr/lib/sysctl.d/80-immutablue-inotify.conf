# Immutablue inotify limits.
#
# inotify has two separate ceilings and they fail in different ways. Watches
# are consumed per watched path; instances are consumed per process that opens
# an inotify fd. The instance ceiling is the one that actually bites on this
# image, because the default of 128 is per-UID, not per-process, and a normal
# session burns through it fast: GNOME/tracker, Syncthing, every language
# server, and Emacs file-notify each hold one or more.
#
# When instances run out the failure is not a clean error. Callers get ENOSPC
# from inotify_init1() and typically degrade silently -- a file watcher that
# simply never fires, an LSP that stops seeing edits, a GNOME session that
# fails to start. That silent-degradation property is why these are raised
# here rather than left to the user to discover.
#
# max_user_watches is set explicitly even though current Fedora already ships
# a high value: pinning it makes the image's behaviour independent of upstream
# default drift.

# Per-UID limit on watched paths. 1048576 watches is roughly 100-200 MB of
# unswappable kernel memory at worst, which is acceptable on any machine this
# image targets.
fs.inotify.max_user_watches = 1048576

# Per-UID limit on inotify instances (file descriptors). The stock 128 is the
# practical bottleneck; 8192 leaves room for a heavily multiplexed session.
fs.inotify.max_user_instances = 8192

# Events buffered per instance before overflow. Raised in proportion to the
# above so that a large tree being rewritten (a git checkout, a rebuild) does
# not push watchers into IN_Q_OVERFLOW, which forces them to rescan.
fs.inotify.max_queued_events = 65536
