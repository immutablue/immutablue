# Immutablue crash-capture defaults.
#
# Only knobs that fire when the machine is already dead: a hard lockup means a
# CPU is wedged with interrupts off, and an unrecovered NMI means the hardware
# reported an uncorrectable fault. Panicking converts a silent freeze into a
# console trace instead of losing the event entirely.
#
# The leading '-' means "ignore if the key does not exist". Both depend on
# CONFIG_HARDLOCKUP_DETECTOR / x86 NMI and are absent on some aarch64 kernels
# (Asahi), where systemd-sysctl would otherwise log an error every boot.
#
# Deliberately NOT set here:
#   kernel.softlockup_panic -- ZFS scrub/txg commit can hold a CPU past the
#                              threshold legitimately; spurious reboots.
#   kernel.panic_on_oops    -- a recoverable GPU driver oops becomes a reboot.
#   kernel.panic            -- auto-reboot destroys an on-screen trace when
#                              there is a human in front of the box.
-kernel.hardlockup_panic = 1
-kernel.panic_on_unrecovered_nmi = 1
